spring.application.name=pagina web de juegos

# Secretos SOLO locales (no versionado, ver .gitignore). Si no existe, se ignora
# silenciosamente y se usan las variables de entorno normales (ej. en Render).
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

spring.elasticsearch.uris=${ES_URIS:https://localhost:9200}
spring.elasticsearch.username=${ES_USERNAME:}
spring.elasticsearch.password=${ES_PASSWORD:}
spring.elasticsearch.restclient.ssl.verification-mode=none

# --- Secretos de la app: SIEMPRE desde variables de entorno (o, en local,
# --- desde application-secrets.properties, que no se sube a git).
jwt.secret=${JWT_SECRET}
app.mail.from=${MAIL_FROM}

# --- Logs: nivel INFO, sin SQL ni datos sensibles.
logging.level.root=INFO
